<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EcoGuard - AI-Powered Air Quality Intelligence for Indian Cities">
    <meta name="keywords" content="AQI, Air Quality, India, Pollution, Forecast, ML, AI">
    <title>{% block title %}EcoGuard - AI-Powered Air Quality Intelligence{% endblock %}</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <script>
        (function() {
            try {
                var storedTheme = localStorage.getItem('ecoguard-theme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var theme = storedTheme || (prefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (error) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='20260312-12') }}">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Leaflet Heat Plugin -->
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/chart.js', v='20260312-12') }}"></script>
    <script src="{{ url_for('static', filename='js/map.js', v='20260312-12') }}"></script>
    <script src="{{ url_for('static', filename='js/location.js', v='20260312-12') }}"></script>
    <script src="{{ url_for('static', filename='js/search.js', v='20260312-12') }}"></script>
    <script>
        (function() {
            function syncThemeToggle(theme) {
                var label = document.getElementById('theme-toggle-label');
                var icon = document.getElementById('theme-toggle-icon');

                if (!label || !icon) {
                    return;
                }

                if (theme === 'dark') {
                    label.textContent = 'Light Mode';
                    icon.className = 'fas fa-sun';
                } else {
                    label.textContent = 'Dark Mode';
                    icon.className = 'fas fa-moon';
                }
            }

            window.toggleEcoGuardTheme = function() {
                const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
                const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', nextTheme);
                localStorage.setItem('ecoguard-theme', nextTheme);
                syncThemeToggle(nextTheme);
            };

            document.addEventListener('DOMContentLoaded', function() {
                syncThemeToggle(document.documentElement.getAttribute('data-theme') || 'light');
            });
        })();
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
